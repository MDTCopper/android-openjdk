name: DEV Build OpenJDK 25 for Android

# Temporary workflow used while porting the JDK 25 patch set: it builds the
# supported JDK 25 architectures and keeps make going after errors so that one
# run reveals as many compile problems as possible.
on:
  push:
  workflow_dispatch:

jobs:
  build_android:
    strategy:
      matrix:
        # JDK 25 has no 32 bit x86 build (removed upstream)
        arch: ["aarch32", "aarch64", "x86_64"]
        version: [25]
      fail-fast: false

    name: "DEV Build Java ${{ matrix.version }} for Android ${{matrix.arch}}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up JDK 1.${{ matrix.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev

      - name: Keep going after build errors (dev iteration only)
        run: sed -i 's/make JOBS=$jobs images/make -k JOBS=$jobs images/g' 6_buildjdk.sh && grep -n 'make -k' 6_buildjdk.sh

      - name: Build with CI build script
        run: |
          # the runners ship a preinstalled NDK of another revision
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
          export TARGET_VERSION=${{ matrix.version }}
          bash "1_ci_build_arch_${{matrix.arch}}.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk${{ matrix.version }}-${{matrix.arch}}"
          path: jdk${{ matrix.version }}*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-${{matrix.arch}}"
          path: jre${{ matrix.version }}*.tar.xz
