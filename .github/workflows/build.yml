name: Build OpenJDK 25 for Android

# Manual only: pushing must not start a build, pick the architecture and press
# "Run workflow" in the Actions tab instead.
# 17 and 21 are still supported by the scripts/patches (see README); add them to
# the version list below if they should be built again.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Android architecture'
        required: true
        type: choice
        default: aarch64
        options:
          - aarch64
          - aarch32
          - x86_64
      version:
        description: 'JDK feature version'
        required: true
        type: choice
        default: '25'
        options:
          - '25'

jobs:
  build_android:
    name: "Build Java ${{ inputs.version }} for Android ${{ inputs.arch }}"
    runs-on: ubuntu-22.04
    # stop a stuck build instead of burning the whole runner budget
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up JDK 1.${{ inputs.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.version }}
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev

      - name: Build with CI build script
        run: |
          # the runners ship a preinstalled NDK, keep it only if it is the right revision
          export TARGET_VERSION=${{ inputs.version }}
          bash "1_ci_build_arch_${{ inputs.arch }}.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk${{ inputs.version }}-${{ inputs.arch }}"
          path: jdk${{ inputs.version }}*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ inputs.version }}-${{ inputs.arch }}"
          path: jre${{ inputs.version }}*.tar.xz
