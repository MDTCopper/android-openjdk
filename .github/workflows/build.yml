name: Build OpenJDK 25 for Android

# Manual only: pushing must not start a build (it would burn runner minutes).
# One dispatch builds aarch32 + aarch64 + x86_64, repacks the JREs into the
# launcher layout (universal.tar.xz + bin-<arch>.tar.xz + version) and refreshes
# the "jre25" release with those files.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the repacked JRE to the jre25 release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # JDK 25 has no 32 bit x86 build (removed upstream)
        arch: ["aarch32", "aarch64", "x86_64"]
    name: "Build JDK 25 for Android ${{ matrix.arch }}"
    runs-on: ubuntu-22.04
    # stop a stuck build instead of burning the whole runner budget
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 (boot JDK)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev

      - name: Build with the CI build script
        run: |
          # the runners ship a preinstalled NDK, keep it only if it is the right revision
          export TARGET_VERSION=25
          bash "1_ci_build_arch_${{ matrix.arch }}.sh"

      - name: Upload JRE
        uses: actions/upload-artifact@v7
        with:
          name: "jre25-${{ matrix.arch }}"
          path: jre25*.tar.xz
          if-no-files-found: error

      - name: Upload JDK
        uses: actions/upload-artifact@v7
        with:
          name: "jdk25-${{ matrix.arch }}"
          path: jdk25*.tar.xz
          if-no-files-found: error

      - name: Verify every ELF keeps a hash table
        run: |
          # bionic refuses to load a library without DT_HASH/DT_GNU_HASH
          # ("empty/missing DT_HASH/DT_GNU_HASH ... new hash type from the
          # future?"), so fail here instead of publishing a broken release.
          set -e
          rm -rf verify-elf && mkdir -p verify-elf
          checked=0
          failed=0
          for tb in jre25*.tar.xz jdk25*.tar.xz; do
            [ -e "$tb" ] || continue
            d="verify-elf/${tb%.tar.xz}"
            mkdir -p "$d"
            tar -xJf "$tb" -C "$d"
            while IFS= read -r f; do
              readelf -h "$f" >/dev/null 2>&1 || continue
              checked=$((checked + 1))
              if ! readelf -d "$f" 2>/dev/null | grep -qE '\(HASH\)|\(GNU_HASH\)'; then
                echo "::error::$f has no DT_HASH/DT_GNU_HASH (bionic cannot load it)"
                failed=$((failed + 1))
              fi
            done < <(find "$d" -type f \( -name '*.so' -o -path '*/bin/*' \))
          done
          echo "checked $checked ELF files, $failed without a hash table"
          [ "$failed" -eq 0 ]

  repack:
    needs: build
    name: "Repack JRE and publish the jre25 release"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the per architecture JREs
        uses: actions/download-artifact@v8
        with:
          pattern: jre25-*
          merge-multiple: true
          path: pojav
          # only the artifacts of this run, never a stale build
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Repack into the launcher layout
        run: |
          export TARGET_VERSION=25
          # oxygen-launcher's JreManager.isLatest() parses this as a number
          export JRE_VERSION=${{ github.run_number }}
          bash 9_repackjre.sh "$PWD/pojav" "$PWD/pojav/jre25-pojav"
          echo "--- repacked bundle ---"
          ls -l pojav/jre25-pojav
          # the launcher parses this with Long.parseLong: numeric, no newline
          vbytes=$(wc -c < pojav/jre25-pojav/version | tr -d '[:space:]')
          if [ "$vbytes" -ne "${#JRE_VERSION}" ]; then
            echo "version file has $vbytes bytes, expected ${#JRE_VERSION} (no trailing newline)" >&2
            exit 1
          fi
          echo "version=$(cat pojav/jre25-pojav/version) bytes=$vbytes"

      - name: Upload the repacked JRE
        uses: actions/upload-artifact@v7
        with:
          name: jre25-pojav
          path: pojav/jre25-pojav/*
          if-no-files-found: error

      - name: Publish to the jre25 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view jre25 >/dev/null 2>&1; then
            gh release edit jre25 --latest \
              --title "JRE 25 for Android (aarch32/aarch64/x86_64)" \
              --notes "Repacked OpenJDK 25 runtime (jdk25u): universal.tar.xz + bin-<arch>.tar.xz + version. version is the CI run number, build ${{ github.run_number }}."
          else
            gh release create jre25 --latest --target "$GITHUB_REF_NAME" \
              --title "JRE 25 for Android (aarch32/aarch64/x86_64)" \
              --notes "Repacked OpenJDK 25 runtime (jdk25u): universal.tar.xz + bin-<arch>.tar.xz + version. version is the CI run number, build ${{ github.run_number }}."
          fi
          gh release upload jre25 pojav/jre25-pojav/* --clobber
          echo "--- assets on the jre25 release ---"
          gh release view jre25 --json tagName,assets --jq '.tagName, (.assets[].name)'
